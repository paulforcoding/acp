name: CI

on:
  push:
    branches: [main, fix/test-hang, feature/v0.5.1]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Ubuntu 24.04
  # ---------------------------------------------------------------------------
  build-ubuntu:
    name: Ubuntu 24.04 (${{ matrix.compiler }}, liburing=${{ matrix.liburing }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        liburing: [ON, OFF]
        include:
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
          - compiler: clang
            cc: clang-18
            cxx: clang++-18

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            libaio-dev \
            liburing-dev \
            libspdlog-dev \
            libfmt-dev \
            libssl-dev \
            libxxhash-dev \
            libacl1-dev

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ubuntu24-${{ matrix.compiler }}-liburing-${{ matrix.liburing }}-${{ github.sha }}
          restore-keys: |
            ubuntu24-${{ matrix.compiler }}-liburing-${{ matrix.liburing }}-

      - name: Configure
        run: |
          export CC="${{ matrix.cc }}"
          export CXX="${{ matrix.cxx }}"
          export CCACHE_DIR="$HOME/.cache/ccache"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_LIBURING=${{ matrix.liburing }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        timeout-minutes: 25
        run: cmake --build build -j$(nproc)

      - name: Test (unit + light integration)
        timeout-minutes: 15
        run: ctest --test-dir build --output-on-failure -E integration

      - name: Upload test logs (unit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-ubuntu-${{ matrix.compiler }}-liburing-${{ matrix.liburing }}-unit-${{ github.run_id }}
          path: |
            test_run.log
            build/test_run.log
            /tmp/acp_program.log
            /tmp/acp_file_info.json
          if-no-files-found: ignore

      - name: Test (full integration)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 30
        run: ctest --test-dir build --output-on-failure

      - name: Upload test logs (integration)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-ubuntu-${{ matrix.compiler }}-liburing-${{ matrix.liburing }}-integration-${{ github.run_id }}
          path: |
            test_run.log
            build/test_run.log
            /tmp/acp_program.log
            /tmp/acp_file_info.json
          if-no-files-found: ignore

      - name: Upload binary artifact
        if: matrix.compiler == 'gcc' && matrix.liburing == 'ON'
        uses: actions/upload-artifact@v4
        with:
          name: acp-ubuntu24-${{ matrix.compiler }}-liburing-${{ matrix.liburing }}
          path: build/acp

  # ---------------------------------------------------------------------------
  # CentOS Stream 9 (via Docker)
  # ---------------------------------------------------------------------------
  build-centos9:
    name: CentOS Stream 9 (gcc, liburing=${{ matrix.liburing }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        liburing: [ON, OFF]
    container:
      image: quay.io/centos/centos:stream9
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            epel-release \
            'dnf-command(config-manager)'
          dnf config-manager --set-enabled crb
          dnf install -y \
            gcc \
            gcc-c++ \
            cmake \
            ninja-build \
            ccache \
            libaio-devel \
            liburing-devel \
            spdlog-devel \
            fmt-devel \
            openssl-devel \
            xxhash-devel \
            libacl-devel

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: centos9-liburing-${{ matrix.liburing }}-${{ github.sha }}
          restore-keys: |
            centos9-liburing-${{ matrix.liburing }}-

      - name: Configure
        run: |
          export CCACHE_DIR="$HOME/.cache/ccache"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_LIBURING=${{ matrix.liburing }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        timeout-minutes: 25
        run: cmake --build build -j$(nproc)

      - name: Test (unit + light integration)
        timeout-minutes: 15
        run: ctest --test-dir build --output-on-failure -E integration

      - name: Upload test logs (unit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-centos9-liburing-${{ matrix.liburing }}-unit-${{ github.run_id }}
          path: |
            test_run.log
            build/test_run.log
            /tmp/acp_program.log
            /tmp/acp_file_info.json
          if-no-files-found: ignore

      - name: Test (full integration)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 30
        run: ctest --test-dir build --output-on-failure

      - name: Upload test logs (integration)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-centos9-liburing-${{ matrix.liburing }}-integration-${{ github.run_id }}
          path: |
            test_run.log
            build/test_run.log
            /tmp/acp_program.log
            /tmp/acp_file_info.json
          if-no-files-found: ignore

      - name: Upload binary artifact
        if: matrix.liburing == 'ON'
        uses: actions/upload-artifact@v4
        with:
          name: acp-centos9-liburing-${{ matrix.liburing }}
          path: build/acp

  # ---------------------------------------------------------------------------
  # macOS 15 (GCD backend)
  # ---------------------------------------------------------------------------
  build-macos:
    name: macOS 15 (Clang, GCD backend)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install \
            cmake \
            ninja \
            ccache \
            spdlog \
            fmt \
            openssl \
            xxhash

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: macos14-clang-${{ github.sha }}
          restore-keys: macos14-clang-

      - name: Configure
        run: |
          export CCACHE_DIR="$HOME/Library/Caches/ccache"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        timeout-minutes: 25
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Test
        timeout-minutes: 20
        run: ctest --test-dir build --output-on-failure

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-macos14-${{ github.run_id }}
          path: |
            test_run.log
            build/test_run.log
            /tmp/acp_program.log
            /tmp/acp_file_info.json
          if-no-files-found: ignore

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: acp-macos14
          path: build/acp

  # ---------------------------------------------------------------------------
  # Sanitizer build (AddressSanitizer + UndefinedBehaviorSanitizer)
  # ---------------------------------------------------------------------------
  sanitizer-ubuntu:
    name: Sanitizer (ASan + UBSan, gcc-13, liburing=ON)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libaio-dev \
            liburing-dev \
            libspdlog-dev \
            libfmt-dev \
            libssl-dev \
            libxxhash-dev \
            libacl1-dev

      - name: Configure with sanitizers
        run: |
          export CC="gcc-13"
          export CXX="g++-13"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_LIBURING=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        timeout-minutes: 30
        run: cmake --build build -j$(nproc)

      - name: Test (full suite)
        timeout-minutes: 30
        run: ctest --test-dir build --output-on-failure

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-sanitizer-${{ github.run_id }}
          path: |
            test_run.log
            build/test_run.log
            /tmp/acp_program.log
            /tmp/acp_file_info.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Repeated preserve_meta test (hang detection)
  # Runs [preserve_meta] tests 20 times to catch intermittent hangs
  # ---------------------------------------------------------------------------
  hang-detection:
    name: Hang detection (preserve_meta x20, gcc, libaio)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libaio-dev \
            libspdlog-dev \
            libfmt-dev \
            libssl-dev \
            libxxhash-dev \
            libacl1-dev

      - name: Configure (libaio only, for hang detection)
        run: |
          export CC="gcc-13"
          export CXX="g++-13"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        timeout-minutes: 20
        run: cmake --build build -j$(nproc)

      - name: Run preserve_meta tests x20
        timeout-minutes: 30
        run: |
          rc=0
          for i in $(seq 1 20); do
            echo "=== Iteration $i/20 starting at $(date) ==="
            > /tmp/acp_program.log
            timeout 60 ./build/test_acp "[preserve_meta]" "~[integration]" 2>&1
            iter_rc=$?
            if [ $iter_rc -eq 142 ]; then
              echo "HANG DETECTED at iteration $i"
              cp /tmp/acp_program.log /tmp/acp_hang_iter_${i}.log 2>/dev/null
              rc=1
            elif [ $iter_rc -ne 0 ]; then
              echo "FAILURE at iteration $i, rc=$iter_rc"
              cp /tmp/acp_program.log /tmp/acp_fail_iter_${i}.log 2>/dev/null
              rc=1
            fi
            echo "=== Iteration $i/20 finished at $(date), rc=$iter_rc ==="
          done
          exit $rc

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hang-detection-logs-${{ github.run_id }}
          path: |
            /tmp/acp_program.log
            /tmp/acp_hang_iter_*.log
            /tmp/acp_fail_iter_*.log
            /tmp/acp_file_info.json
          if-no-files-found: ignore
